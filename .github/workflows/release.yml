name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUN_VERSAO: "1.3.14"
  FLUTTER_VERSAO: "3.47.5"

jobs:
  ai-memory:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-memory
      - name: compilar
        working-directory: ai-memory
        run: cargo build --release --locked -p ai-memory-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ai-memory
          path: ai-memory/target/release/ai-memory
          if-no-files-found: error

  servidor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSAO }}
      - name: instalar e testar
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun test
      - name: compilar
        working-directory: app
        run: |
          mkdir -p ../artefatos
          bun build --compile --minify src/server.ts --outfile ../artefatos/control-tower-servidor
          bun build --compile --minify mcp/server.ts --outfile ../artefatos/control-tower-mcp
          cp node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude ../artefatos/claude
      - uses: actions/upload-artifact@v4
        with:
          name: servidor
          path: artefatos/
          if-no-files-found: error

  flutter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: keystore do APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::secret ANDROID_DEBUG_KEYSTORE ausente. Sem ele o APK sairia com chave aleatória e não atualizaria o instalado. Rode: gh secret set ANDROID_DEBUG_KEYSTORE < <(base64 -w0 ~/.android/debug.keystore)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSAO }}
          channel: stable
          cache: true
      - name: dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev
      - name: testar
        working-directory: cliente
        run: |
          flutter pub get
          flutter test
      - name: compilar
        working-directory: cliente
        run: |
          flutter build linux --release
          flutter build apk --release
          mkdir -p ../artefatos
          tar -C build/linux/x64/release/bundle -czf ../artefatos/cliente.tar.gz .
          cp build/app/outputs/flutter-apk/app-release.apk ../artefatos/control-tower.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flutter
          path: artefatos/
          if-no-files-found: error

  pacote:
    needs: [ai-memory, servidor, flutter]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: baixados
      - name: montar o .deb
        run: |
          mkdir -p artefatos/cliente
          cp baixados/ai-memory/ai-memory artefatos/
          cp baixados/servidor/* artefatos/
          cp baixados/flutter/control-tower.apk artefatos/
          tar -C artefatos/cliente -xzf baixados/flutter/cliente.tar.gz
          versao="${GITHUB_REF_NAME#v}"
          bash scripts/montar-deb.sh "$versao" artefatos saida
          cp artefatos/control-tower.apk "saida/control-tower-$versao.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            saida/*.deb
            saida/*.apk
          body: |
            Instalar ou atualizar:

            ```bash
            gh release download -R ${{ github.repository }} -p '*.deb' -D /tmp --clobber && sudo apt install -y /tmp/control-tower_*_amd64.deb
            ```

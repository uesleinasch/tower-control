name: testes

on:
  push:
    branches: [Production, development]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - working-directory: app
        run: |
          bun install --frozen-lockfile
          bun test

  flutter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - working-directory: cliente
        run: |
          flutter pub get
          flutter test

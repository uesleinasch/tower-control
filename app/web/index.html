<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#171b25" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tower" />
  <title>Control Tower</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icone-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="lateral">
    <header id="marca">
      <h1>Control Tower</h1>
      <p>sala de decisões</p>
    </header>

    <nav id="perfis">
      <h2 class="folha-titulo">Nova conversa</h2>
      <div id="lista-personas"></div>
      <span class="divisor-perfis" role="separator"></span>
      <button id="botao-board"><span class="avatar board">B</span><span class="nome">Convocar board<small>deliberação em conselho</small></span></button>
      <button id="botao-decisoes"><span class="avatar decisoes">D</span><span class="nome">Decisões<small>registro e consulta</small></span></button>
      <button id="botao-painel"><span class="avatar painel">P</span><span class="nome">Painel<small>o que precisa de você e o que roda agora</small></span></button>
      <button id="botao-tarefas"><span class="avatar tarefas">T</span><span class="nome">Tarefas<small>o que as personas têm a fazer</small></span></button>
      <button id="botao-equipes"><span class="avatar equipes">E</span><span class="nome">Equipes<small>organograma e personas</small></span></button>
    </nav>

    <section id="conversas">
      <h2>Conversas</h2>
      <ul id="lista-conversas"></ul>
    </section>

    <div id="veu"></div>

    <button id="nova-conversa" aria-label="Nova conversa" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19 9a2.5 2.5 0 00-3.5-3.5L4.5 16.5 4 20z" />
        <path d="M14.5 6.5l3 3" />
      </svg>
    </button>
  </aside>

  <main id="principal">
    <header id="cabecalho">
      <button id="voltar" aria-label="Voltar para a lista">←</button>
      <span class="avatar" id="avatar-conversa" hidden></span>
      <span id="titulo-conversa">Escolha um perfil para começar</span>
      <span id="controles">
        <button id="ticktask" hidden aria-pressed="false"
                title="registro direto no TickTask: o Alfred usa as ferramentas do app">TickTask</button>
        <button id="auto" hidden aria-pressed="false"
                title="modo auto: roda comando sem pedir aprovação (os sensíveis ainda pedem) e usa Opus 5.5">auto</button>
        <select id="seletor-modelo" title="modelo usado nas respostas desta conversa">
          <option value="haiku">Haiku · padrão</option>
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
        </select>
        <span id="estado-conexao" title="conexão">●</span>
      </span>
    </header>

    <section id="mensagens"></section>

    <div id="atalhos" hidden></div>

    <div id="pendentes" hidden></div>

    <div id="citacao" hidden>
      <span id="citacao-texto"></span>
      <button id="citacao-fechar" title="cancelar resposta">×</button>
    </div>

    <footer id="composer">
      <button id="clipe" aria-label="Anexar arquivo">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M16.5 6.8v8.7a4.5 4.5 0 01-9 0V6.3a3 3 0 016 0v9.2a1.5 1.5 0 01-3 0V7.4" />
        </svg>
      </button>
      <textarea id="entrada" rows="1" placeholder="Escreva sua mensagem…"></textarea>
      <button id="enviar" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor" />
        </svg>
      </button>
    </footer>
  </main>

  <div id="menu-balao" class="menu" hidden>
    <button data-acao="responder">↩ Responder</button>
    <button data-acao="copiar">⧉ Copiar</button>
  </div>

  <div id="menu-conversa" class="menu" hidden>
    <button data-acao="excluir" class="perigo">🗑 Excluir conversa</button>
  </div>

  <div id="confirmacao" hidden>
    <div class="caixa">
      <p id="confirmacao-texto"></p>
      <div class="acoes">
        <button id="confirmacao-nao">Cancelar</button>
        <button id="confirmacao-sim" class="perigo">Excluir</button>
      </div>
    </div>
  </div>

  <div id="menu-anexo" class="menu" hidden>
    <button data-fonte="camera">📷 Câmera</button>
    <button data-fonte="galeria">🖼 Galeria</button>
    <button data-fonte="arquivo">📄 Arquivo</button>
  </div>

  <input id="fonte-camera" type="file" accept="image/*" capture="environment" hidden />
  <input id="fonte-galeria" type="file" accept="image/*" multiple hidden />
  <input id="fonte-arquivo" type="file" multiple hidden
         accept="text/*,application/pdf,.log,.md,.txt,.csv,.json,.ts,.js,.py,.sql,.yml,.yaml,.sh" />

  <script src="/app.js"></script>
</body>
</html>
